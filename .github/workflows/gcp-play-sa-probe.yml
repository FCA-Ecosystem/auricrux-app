name: GCP Play-SA Probe

# RETIRED: GCP cutover is no longer a live path (Azure gone; production is Oracle/Railway).
# Jobs no-op unless workflow_dispatch input confirm_retired_gcp == ENABLE-RETIRED-GCP.

on:
  workflow_dispatch:
    inputs:
      confirm_retired_gcp:
        description: "Retired GCP workflow (prod is Oracle/Railway). Type ENABLE-RETIRED-GCP to run."
        required: true
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_retired_gcp == 'ENABLE-RETIRED-GCP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe Play SA projects and VMs
        run: |
          set -euo pipefail
          CREDS="$GOOGLE_GHA_CREDS_PATH"
          python3 -c "import json; d=json.load(open('$CREDS')); print('email',d.get('client_email')); print('project',d.get('project_id'))"
          gcloud projects list --format='table(projectId,name)' 2>&1 || true
          for p in $(gcloud projects list --format='value(projectId)' 2>/dev/null); do
            echo "==== $p billing ===="
            gcloud billing projects describe "$p" 2>&1 || true
            echo "==== $p instances ===="
            gcloud compute instances list --project="$p" --format='table(name,zone,status,networkInterfaces[0].accessConfigs[0].natIP)' 2>&1 || true
          done
