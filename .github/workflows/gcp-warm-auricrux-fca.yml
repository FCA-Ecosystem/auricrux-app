name: GCP Warm Auricrux-FCA

# RETIRED: GCP cutover is no longer a live path (Azure gone; production is Oracle/Railway).
# Jobs no-op unless workflow_dispatch input confirm_retired_gcp == ENABLE-RETIRED-GCP.

# Warm existing product auricrux-fca (merged LoRA GGUF) — never recreate from Modelfile.
# UNSAFE-06 / ZG-M03: Modelfile.auricrux-fca is DEV FALLBACK ONLY. Product cutover uses GCS mint/load.
on:
  workflow_dispatch:
    inputs:
      confirm_retired_gcp:
        description: "Retired GCP workflow (prod is Oracle/Railway). Type ENABLE-RETIRED-GCP to run."
        required: true
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_retired_gcp == 'ENABLE-RETIRED-GCP'
    runs-on: ubuntu-latest
    env:
      ZONE: us-central1-b
      INSTANCE: instance-20260715-113528
      PROJECT: auricrux-mobile-prod
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Warm existing product auricrux-fca (no Modelfile recreate)
        run: |
          set -euo pipefail
          echo "CLOUDSDK_CORE_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          gcloud config set project auricrux-mobile-prod

          cat > /tmp/warm-fca.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail
          sudo docker network connect fca-net auricrux-ollama 2>/dev/null || true
          echo "=== models before ==="
          sudo docker exec auricrux-ollama ollama list || true

          if ! sudo docker exec auricrux-ollama ollama list | grep -q 'auricrux-fca'; then
            echo "FAIL: auricrux-fca missing. Use GCS mint/load GGUF cutover — do NOT Modelfile/llama3.2 recreate."
            exit 1
          fi

          # Unload peers only; keep product blobs.
          sudo docker exec auricrux-ollama ollama stop llava 2>/dev/null || true
          sudo docker exec auricrux-ollama ollama stop moondream 2>/dev/null || true
          sudo docker exec auricrux-ollama ollama stop auricrux-coder 2>/dev/null || true

          echo "=== warm generate (existing product tag) ==="
          sudo docker exec auricrux-ollama ollama run auricrux-fca "What is a sill plate? Answer in 3 sentences." || true

          echo "=== models after ==="
          sudo docker exec auricrux-ollama ollama list || true

          curl -fsS http://127.0.0.1:5001/api/health; echo
          curl -fsS -m 120 -H 'Content-Type: application/json' \
            -d '{"Query":"What is a sill plate?","ThinkingMode":1,"SearchScope":2}' \
            http://127.0.0.1:5001/api/chat | head -c 600; echo
          REMOTE

          gcloud compute scp /tmp/warm-fca.sh "${INSTANCE}:/tmp/warm-fca.sh" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command='bash /tmp/warm-fca.sh'
