name: GCP VM Deep Inspect

# RETIRED: GCP cutover is no longer a live path (Azure gone; production is Oracle/Railway).
# Jobs no-op unless workflow_dispatch input confirm_retired_gcp == ENABLE-RETIRED-GCP.

on:
  workflow_dispatch:
    inputs:
      confirm_retired_gcp:
        description: "Retired GCP workflow (prod is Oracle/Railway). Type ENABLE-RETIRED-GCP to run."
        required: true
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_retired_gcp == 'ENABLE-RETIRED-GCP'
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_CORE_PROJECT: auricrux-mobile-prod
      CLOUDSDK_PROJECT: auricrux-mobile-prod
      GCLOUD_PROJECT: auricrux-mobile-prod
      GCP_PROJECT: auricrux-mobile-prod
      GOOGLE_CLOUD_PROJECT: auricrux-mobile-prod
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deep inspect
        run: |
          set -euo pipefail
          PROJECT=auricrux-mobile-prod
          ZONE=us-central1-b
          INSTANCE=instance-20260715-113528
          gcloud config set project "$PROJECT"
          cat > /tmp/deep-inspect.sh <<'REMOTE'
          #!/bin/bash
          set -e
          echo "=== /etc/caddy/Caddyfile ==="
          sudo cat /etc/caddy/Caddyfile
          echo "=== compose candidates ==="
          sudo find /opt /home /var/www /root -name 'docker-compose*.yml' 2>/dev/null | head -40 || true
          ls -la /opt 2>/dev/null || true
          ls -la /opt/fca 2>/dev/null || true
          ls -la /opt/auricrux 2>/dev/null || true
          echo "=== fca-api inspect ==="
          sudo docker inspect fca-api --format 'Image={{.Config.Image}} Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}} NetworkMode={{.HostConfig.NetworkMode}}'
          sudo docker inspect fca-api --format '{{json .Config.Env}}'
          sudo docker inspect fca-api --format '{{json .NetworkSettings.Ports}}'
          sudo docker inspect fca-api --format '{{json .Config.Healthcheck}}'
          echo "=== images ==="
          sudo docker images | head -40
          echo "=== route probes ==="
          for p in /health /api/health /api/catalog /swagger/index.html; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:5000$p" || echo err)
            echo "$p -> $code $(head -c 120 /tmp/body | tr '\n' ' ')"
          done
          echo "=== auricrux-api probes ==="
          for p in /health /api/capabilities /api/agent/tools; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:5001$p" || echo err)
            echo "$p -> $code $(head -c 120 /tmp/body | tr '\n' ' ')"
          done
          REMOTE
          sed -i 's/^          //' /tmp/deep-inspect.sh
          gcloud compute scp /tmp/deep-inspect.sh "${INSTANCE}:/tmp/deep-inspect.sh" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command='bash /tmp/deep-inspect.sh'
