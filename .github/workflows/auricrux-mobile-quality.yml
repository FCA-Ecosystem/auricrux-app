name: Auricrux Mobile Quality

on:
  pull_request:
    paths:
      - "apps/auricrux-mobile/**"
      - ".github/workflows/auricrux-mobile-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/auricrux-mobile/**"
      - ".github/workflows/auricrux-mobile-quality.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auricrux-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and quality gate
        run: npm run ci:quality

      - name: Export training seed candidates
        run: npm run ci:seed

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auricrux-mobile-quality-artifacts
          path: |
            apps/auricrux-mobile/artifacts/eval
            apps/auricrux-mobile/artifacts/training
