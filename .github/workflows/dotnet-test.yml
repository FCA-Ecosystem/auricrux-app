name: .NET Test

on:
  push:
    branches: [main]
    paths:
      - 'Auricrux.Web/**'
      - 'Auricrux.Shared/**'
      - 'Auricrux.Tests/**'
      - 'AuricruxApp.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/dotnet-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Auricrux.Web/**'
      - 'Auricrux.Shared/**'
      - 'Auricrux.Tests/**'
      - 'AuricruxApp.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/dotnet-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AuricruxApp.sln

      - name: Build
        run: dotnet build AuricruxApp.sln -c Release --no-restore

      - name: Test
        run: dotnet test Auricrux.Tests/Auricrux.Tests.csproj -c Release --no-build --verbosity normal
