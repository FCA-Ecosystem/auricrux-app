name: Apple Platform Build

# macOS runners bill at 10x Linux minutes. Do not auto-run on push/PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-maccatalyst:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build iOS (device)
        id: ios
        continue-on-error: true
        run: |
          # GitHub macos-latest Xcode can lag the MAUI iOS SDK requirement; allow soft-fail
          # so Android/web claims keep shipping. Hard fail only when both Apple TFMs fail.
          dotnet build Auricrux.Mobile/Auricrux.Mobile.csproj -c Release -f net10.0-ios -p:ValidateXcodeVersion=false

      - name: Build Mac Catalyst
        id: maccatalyst
        continue-on-error: true
        run: |
          dotnet build Auricrux.Mobile/Auricrux.Mobile.csproj -c Release -f net10.0-maccatalyst -p:ValidateXcodeVersion=false

      - name: Report build result
        run: |
          echo "### Apple Platform Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- iOS (net10.0-ios): **${{ steps.ios.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mac Catalyst (net10.0-maccatalyst): **${{ steps.maccatalyst.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: IPA/App Store signing requires Apple Developer certificates (founder-only)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ios.outcome }}" != "success" ] && [ "${{ steps.maccatalyst.outcome }}" != "success" ]; then
            echo "Both Apple TFM builds failed" >&2
            exit 1
          fi
