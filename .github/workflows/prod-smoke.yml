name: Production Smoke

# Azure is permanently retired — this workflow must never point at *.azurewebsites.net.
# Target resolution order:
#   1. workflow_dispatch input
#   2. repository variable PROD_SMOKE_BASE_URL (set this when the live host is not the custom domain)
#   3. the documented custom domain
on:
  schedule:
    # Daily, not every 6 hours. The 6-hour cadence was ~180 min/week, mostly
    # failures still consuming a full smoke run.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production base URL to smoke test'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve production target
        id: target
        shell: bash
        run: |
          base="${{ github.event.inputs.base_url }}"
          if [ -z "$base" ]; then base="${{ vars.PROD_SMOKE_BASE_URL }}"; fi
          # Live product is HTTPS on Oracle .65 behind Caddy; Azure is retired.
          if [ -z "$base" ]; then base="https://auricrux.futurecontractorsofamerica.com"; fi
          case "$base" in
            *azurewebsites.net*)
              echo "::error::Azure is retired; refusing to smoke test $base. Set the PROD_SMOKE_BASE_URL repository variable."
              exit 1
              ;;
          esac
          echo "base_url=$base" >> "$GITHUB_OUTPUT"
          echo "Smoke target: $base"

      - name: Run production smoke script
        shell: pwsh
        run: ./scripts/smoke_prod.ps1 -BaseUrl '${{ steps.target.outputs.base_url }}'

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report
          path: eval/reports/prod_smoke_last_run.json
