name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Auricrux.Web/**'
      - 'Auricrux.Shared/**'
      - '.github/workflows/docker-build.yml'
  # PRs already run .NET Test. Docker image build on every PR duplicated minutes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect registry credentials
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "image=docker.io/${DOCKERHUB_USERNAME}/auricrux-web" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN present — image will be pushed to Docker Hub."
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "image=auricrux-web" >> "$GITHUB_OUTPUT"
            echo "::notice::No DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secret — building only (no push), image kept in local CI runner cache."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.registry.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.registry.outputs.image }}:ci-${{ github.run_number }}
            ${{ steps.registry.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test built image
        run: |
          set -euo pipefail
          docker run -d --name auricrux-web-smoke -p 8080:80 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            "${{ steps.registry.outputs.image }}:ci-${{ github.run_number }}"
          echo "Waiting for container health..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Container never became healthy"
              docker logs auricrux-web-smoke || true
              exit 1
            fi
            sleep 2
          done
          docker rm -f auricrux-web-smoke

      - name: Push image
        if: steps.registry.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:ci-${{ github.run_number }}
            ${{ steps.registry.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report build result
        run: |
          echo "### Docker Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image built from root \`Dockerfile\`: **success**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pushed to registry: **${{ steps.registry.outputs.push }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test (`/health`): **passed**" >> "$GITHUB_STEP_SUMMARY"
